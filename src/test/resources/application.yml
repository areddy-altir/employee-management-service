# H2 in-memory DB for tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.user.server-url}/realms/${keycloak.user.realm}

# Keycloak (test values - Keycloak not required for context load)
keycloak:
  user:
    server-url: http://localhost:8180
    realm: employee-management
  admin:
    server-url: http://localhost:8180
    realm: employee-management
    client-id: employee-management-service
    client-secret: test-secret
